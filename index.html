<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wee Oya — Reports Map / نقشه اسناد / ලේඛන සිතියම</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1620; --panel:#13212e; --panel2:#1a2c3c; --line:#2a4256;
    --ink:#e9f2f8; --muted:#90a8bb; --gold:#e7b85c;
    --atkins:#4ea3c9; --cecb:#5cc08a; --mgce:#e07a5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Vazirmatn","Noto Sans Sinhala","Segoe UI",Tahoma,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,#16364a 0%,transparent 60%),var(--bg);
    color:var(--ink);line-height:1.7;padding:0 0 60px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* language bar */
  .langbar{position:sticky;top:0;z-index:40;background:rgba(9,17,25,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:10px;padding:11px 0}
  .langbtn{cursor:pointer;font-family:inherit;font-weight:800;font-size:.95rem;letter-spacing:.3px;
    border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    padding:7px 20px;border-radius:30px;transition:.18s}
  .langbtn:hover{border-color:var(--gold)}
  .langbtn.active{background:var(--gold);color:#10202c;border-color:var(--gold)}

  /* cover + connect */
  .cover{max-width:1180px;margin:16px auto 0;padding:0 20px}
  .cover-img{width:100%;border-radius:18px;display:block;border:1px solid var(--line);box-shadow:0 12px 44px rgba(0,0,0,.45)}
  .connect{max-width:1180px;margin:20px auto 0;padding:0 20px}
  .connect-card{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 26px}
  .qr{background:#fff;padding:10px;border-radius:14px;line-height:0;flex:0 0 auto}
  .qr svg{display:block;width:150px;height:150px}
  .connect-txt{text-align:center}
  .connect-txt .cline{font-size:1.02rem;font-weight:700;margin-bottom:12px;max-width:330px}
  .connect-txt a.li{display:inline-flex;align-items:center;gap:9px;direction:ltr;
    background:#0a66c2;color:#fff;text-decoration:none;font-weight:700;
    padding:10px 20px;border-radius:30px;font-size:.92rem;transition:.2s}
  .connect-txt a.li:hover{background:#0954a0;transform:translateY(-2px)}
  .connect-txt .liurl{display:block;margin-top:9px;direction:ltr;font-size:.8rem;font-family:monospace}
  .connect-txt .liurl a{color:var(--gold);text-decoration:none}
  .connect-txt .liurl a:hover{text-decoration:underline}
  @media(max-width:600px){.qr svg{width:124px;height:124px}}
  /* ===== full-screen landing / entry ===== */
  #landing{position:fixed;inset:0;z-index:100;background:#0c1620;overflow:hidden}
  #landing-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  #landing-qr{position:absolute;right:3.5%;bottom:15%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px}
  #landing-qr .lqr{background:#fff;padding:6px;border-radius:10px;line-height:0;box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #landing-qr .lqr svg{display:block;width:92px;height:92px}
  #landing-qr .lqr-link{font-family:monospace;font-size:.7rem;color:#fff;background:rgba(10,32,44,.65);
    padding:3px 9px;border-radius:20px;text-decoration:none;direction:ltr}
  #landing-qr .lqr-link:hover{text-decoration:underline}
  #enterBtn{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);z-index:2;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:1.05rem;letter-spacing:.5px;
    background:var(--gold);color:#10202c;border:none;padding:14px 42px;border-radius:40px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);transition:.2s;animation:epulse 2.6s infinite}
  #enterBtn:hover{transform:translateX(-50%) translateY(-3px) scale(1.04)}
  @keyframes epulse{0%,100%{box-shadow:0 8px 28px rgba(0,0,0,.45)}50%{box-shadow:0 8px 40px rgba(231,184,92,.65)}}
  @media(max-width:600px){#landing-qr{bottom:17%}#landing-qr .lqr svg{width:64px;height:64px}
    #enterBtn{font-size:.92rem;padding:12px 30px}}
  .lqr-credit{text-align:left;direction:ltr;line-height:1.35;background:rgba(8,20,28,.55);padding:5px 13px;border-radius:13px;backdrop-filter:blur(2px)}
  .lqr-credit .credit-by{display:block;font-size:.6rem;color:#eaf3fa;letter-spacing:.4px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .lqr-credit .credit-name{display:inline-block;margin-top:2px;text-decoration:none;font-weight:800;font-size:1rem;letter-spacing:.4px;
    background:linear-gradient(100deg,#e7b85c 0%,#fff7da 22%,#9fe9ff 48%,#fff7da 74%,#e7b85c 100%);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    animation:nameShine 2.6s linear infinite;cursor:pointer;transition:transform .2s}
  .lqr-credit .credit-name:hover{transform:scale(1.07);filter:drop-shadow(0 0 7px rgba(231,184,92,.95))}
  @keyframes nameShine{0%{background-position:0% center}100%{background-position:-220% center}}
  header{padding:34px 0 18px;text-align:center}
  header .kicker{color:var(--gold);letter-spacing:1px;font-size:.82rem;font-weight:700}
  header h1{font-size:1.85rem;margin:6px 0 4px;font-weight:800}
  header p{color:var(--muted);font-size:.95rem;max-width:780px;margin:0 auto}
  .stats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px 0 8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:120px;text-align:center}
  .stat b{display:block;font-size:1.5rem;color:var(--gold)}
  .stat span{font-size:.78rem;color:var(--muted)}

  h2.sec{font-size:1.18rem;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
  h2.sec::before{content:"";width:6px;height:22px;background:var(--gold);border-radius:3px;display:inline-block}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .fbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 16px;border-radius:30px;font-size:.86rem;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:8px}
  .fbtn:hover{border-color:var(--gold)}
  .fbtn .dot{width:11px;height:11px;border-radius:50%}
  .fbtn.active{background:var(--panel2);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch;margin:6px 0 10px}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin:0 8px;transition:.25s}
  .phase:hover{transform:translateY(-4px)}
  .phase .ph-top{height:5px;border-radius:4px;margin-bottom:10px}
  .phase h3{font-size:1rem;margin-bottom:2px}
  .phase .co{font-size:.8rem;color:var(--muted);margin-bottom:8px}
  .phase .yr{font-size:.74rem;color:var(--gold);font-weight:700}
  .phase ul{list-style:none;margin-top:8px;font-size:.78rem;color:var(--muted)}
  .phase ul li{padding:2px 0}
  .phase ul li::before{content:"◂ ";color:var(--line)}
  .flow-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:6px}

  .timeline{position:relative;margin:10px 0 30px;padding:30px 0 10px;overflow-x:auto}
  .axis{position:relative;height:3px;background:var(--line);margin:0 10px;border-radius:3px;min-width:760px}
  .tick{position:absolute;top:-26px;transform:translateX(50%);text-align:center;color:var(--muted);font-size:.74rem}
  .tick i{display:block;width:2px;height:10px;background:var(--line);margin:4px auto -2px}
  .tnode{position:absolute;top:-7px;transform:translateX(50%);width:16px;height:16px;border-radius:50%;
    border:3px solid var(--bg);cursor:pointer;transition:.2s}
  .tnode:hover{transform:translateX(50%) scale(1.5)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;
    transition:.2s;border-right:4px solid var(--line);overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--gold)}
  .card.dim{opacity:.18;filter:saturate(.3)}
  .card .badge{font-size:.68rem;padding:3px 9px;border-radius:20px;display:inline-block;font-weight:700;margin-bottom:8px}
  .card h4{font-size:.93rem;margin-bottom:5px;line-height:1.45}
  .card .meta{font-size:.74rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
  .card .ref{font-family:monospace;font-size:.7rem;color:var(--gold);direction:ltr}
  .card .type{font-size:.78rem;color:var(--ink);opacity:.85;margin-top:4px}

  .overlay{position:fixed;inset:0;background:rgba(4,10,16,.78);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel2);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;
    max-height:86vh;overflow-y:auto;padding:24px}
  .modal .x{float:inline-end;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1;border:none;background:none}
  .modal .badge{font-size:.7rem;padding:3px 10px;border-radius:20px;font-weight:700}
  .modal h3{font-size:1.15rem;margin:10px 0 4px}
  .modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
  .mrow span:first-child{color:var(--muted)}
  .mrow span:last-child{text-align:start}
  .mdesc{margin-top:14px;font-size:.88rem;color:var(--ink);opacity:.92}
  .mrel{margin-top:14px;background:var(--panel);border-radius:12px;padding:12px}
  .mrel b{font-size:.8rem;color:var(--gold);display:block;margin-bottom:6px}
  .mrel ul{list-style:none;font-size:.82rem;color:var(--muted)}
  .mrel li{padding:3px 0}
  .mrel li::before{content:"↳ ";color:var(--gold)}
  footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:40px}
  @media(max-width:760px){.flow{grid-template-columns:1fr;gap:10px}.phase{margin:0}}
</style>
</head>

let LANG='fa';
const grid=document.getElementById('grid');
const axis=document.getElementById('axis');
const flow=document.getElementById('flow');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');
let activeFilter='all';
const tx=(v)=>typeof v==='object'?(v[LANG]||v.en):v;
const coStyle=(co)=>`background:${COLORS[co]}22;color:${COLORS[co]};border:1px solid ${COLORS[co]}66`;

function render(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==='fa')?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.dataset.t][LANG];});

  // phases
  flow.innerHTML='';
  PHASES.forEach(p=>{
    const d=document.createElement('div');d.className='phase';if(p.co)d.dataset.co=p.co;
    if(p.future)d.style.opacity='.7';
    d.innerHTML=`<div class="ph-top" style="background:${p.color}"></div>
      <div class="yr">${tx(p.yr)}</div>
      <h3>${tx(p.title)}</h3>
      <div class="co">${tx(p.coName)}</div>
      <ul>${tx(p.list).map(x=>`<li>${x}</li>`).join('')}</ul>`;
    flow.appendChild(d);
  });

  // filters
  const fl=document.getElementById('filters');
  fl.innerHTML=`<button class="fbtn" data-f="all">${T.f_all[LANG]}</button>`+
    ['atkins','cecb','mgce'].map(c=>`<button class="fbtn" data-f="${c}"><span class="dot" style="background:${COLORS[c]}"></span>${CONAME[c]}</button>`).join('');

  // cards
  grid.innerHTML='';
  DOCS.forEach((d,i)=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.co=d.co;c.style.borderRightColor=COLORS[d.co];
    c.innerHTML=`<span class="badge" style="${coStyle(d.co)}">${CONAME[d.co]}</span>
      <h4>${d.title}</h4>
      <div class="type">${tx(d.type)}</div>
      <div class="meta"><span>📅 ${tx(d.date)}</span><span>📄 ${d.pages}</span></div>
      <div class="meta"><span class="ref">${d.ref}</span></div>`;
    c.onclick=()=>openModal(i);
    grid.appendChild(c);
  });

  // timeline
  axis.innerHTML='';
  [2015,2017,2019,2021,2023,2025,2026].forEach(y=>{
    const pos=(y-2015)/(2026-2015)*100;
    const t=document.createElement('div');t.className='tick';t.style.left=pos+'%';
    t.innerHTML=`${y}<i></i>`;axis.appendChild(t);
  });
  DOCS.forEach((d,i)=>{
    const n=document.createElement('div');n.className='tnode';
    n.style.left=d.pos+'%';n.style.background=COLORS[d.co];n.dataset.co=d.co;
    n.title=d.title;n.onclick=()=>openModal(i);axis.appendChild(n);
  });

  applyFilter(activeFilter);
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}

function applyFilter(f){
  activeFilter=f;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('active',x.dataset.f===f));
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim',f!=='all'&&c.dataset.co!==f));
  document.querySelectorAll('.tnode').forEach(n=>n.style.opacity=(f==='all'||n.dataset.co===f)?'1':'.2');
  document.querySelectorAll('.phase').forEach(p=>{if(p.dataset.co)p.style.opacity=(f==='all'||p.dataset.co===f)?'1':'.35';});
}

function openModal(i){
  const d=DOCS[i];
  modal.innerHTML=`<button class="x" onclick="closeModal()">✕</button>
    <span class="badge" style="${coStyle(d.co)}">${CONAME[d.co]}</span>
    <h3>${d.title}</h3>
    <div class="sub">${tx(d.type)}</div>
    <div class="mrow"><span>${T.m_date[LANG]}</span><span>${tx(d.date)}</span></div>
    <div class="mrow"><span>${T.m_ref[LANG]}</span><span style="direction:ltr">${d.ref}</span></div>
    <div class="mrow"><span>${T.m_pg[LANG]}</span><span>${d.pages}</span></div>
    <div class="mrow"><span>${T.m_rev[LANG]}</span><span>${tx(d.rev)}</span></div>
    <div class="mrow"><span>${T.m_scale[LANG]}</span><span>${tx(d.scale)}</span></div>
    <div class="mdesc">${tx(d.desc)}</div>
    <div class="mrel"><b>${T.m_rel[LANG]}</b><ul>${tx(d.rel).map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
  overlay.classList.add('show');
}
function closeModal(){overlay.classList.remove('show');}

document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(b)applyFilter(b.dataset.f);});
document.querySelector('.langbar').addEventListener('click',e=>{
  const b=e.target.closest('.langbtn');if(!b)return;LANG=b.dataset.lang;
  try{localStorage.setItem('weeoya_lang',LANG)}catch(_){}
  render();
});
overlay.onclick=e=>{if(e.target===overlay)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
